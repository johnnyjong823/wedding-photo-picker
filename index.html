<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>婚紗照選擇器</title>
<meta name="description" content="左滑右滑挑婚紗照：右滑精修、左滑不要、上滑其他用途（小卡、相本、禮物）">
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --ink:#2b2420; --muted:#7a6e66; --line:#ebe3d9;
  --accent:#b5485d; --accent-soft:#f6e4e7; --gold:#b08a4a; --gold-soft:#f5ecdc;
  --ok:#3f8a5a; --ok-soft:#e3f1e7; --bad:#9a928b; --bad-soft:#efebe7; --warn:#b7791f; --warn-soft:#fbf0dc;
  --stage:#1d1916; --shadow:0 10px 30px rgba(43,36,32,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1917; --card:#26211e; --ink:#f1ebe4; --muted:#a8998d; --line:#3a332e;
    --accent:#e07a8e; --accent-soft:#3b2529; --gold:#d4b071; --gold-soft:#352c1e;
    --ok:#6cc08b; --ok-soft:#203126; --bad:#8d847c; --bad-soft:#2e2926; --warn:#e3a94f; --warn-soft:#3a2f1c;
    --stage:#0f0d0c; --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#1c1917; --card:#26211e; --ink:#f1ebe4; --muted:#a8998d; --line:#3a332e;
  --accent:#e07a8e; --accent-soft:#3b2529; --gold:#d4b071; --gold-soft:#352c1e;
  --ok:#6cc08b; --ok-soft:#203126; --bad:#8d847c; --bad-soft:#2e2926; --warn:#e3a94f; --warn-soft:#3a2f1c;
  --stage:#0f0d0c; --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:var(--font,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif);line-height:1.5}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

#app{height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto}
.hdr{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 16px 6px}
.hdr h1{font-size:calc(17px*var(--fz,1));margin:0;font-weight:700;letter-spacing:.04em}
.hdr .me{font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:1px 9px}
.hdr .sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;background:none;border:0;padding:4px 0;cursor:pointer}
.hdr .sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.hdr .sync.busy::before{background:var(--warn)} .hdr .sync.off::before,.hdr .sync.err::before{background:#c0392b}

#view{overflow-x:hidden;overflow-y:auto;position:relative;min-height:0;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;scrollbar-width:none}
#view::-webkit-scrollbar,.v-scroll::-webkit-scrollbar,.adm-body::-webkit-scrollbar{display:none}
html,body{overscroll-behavior:none}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--card);
  padding-bottom:env(safe-area-inset-bottom)}
.tabs button{border:0;background:none;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;
  font-size:19px;color:var(--muted);position:relative;cursor:pointer}
.tabs button span{font-size:calc(11px*var(--fz,1))}
.tabs button.on{color:var(--accent)}
.tabs .badge{position:absolute;top:3px;left:calc(50% + 6px);background:var(--accent);color:#fff;font-style:normal;
  font-size:10px;min-width:17px;height:17px;border-radius:9px;padding:0 4px;line-height:17px}
.tabs .badge:empty{display:none}
body.gated .tabs{display:none}

/* ---------- 滑卡 ---------- */
.dv{height:100%;display:flex;flex-direction:column;padding:2px 12px 0;overflow:hidden;overflow:clip} /* 卡片飛出去不會撐出卷軸 */
.dv-head{display:flex;align-items:center;gap:10px;font-size:calc(13px*var(--fz,1));color:var(--muted);padding:2px 4px 8px;flex-wrap:wrap}
.dv-head b{color:var(--ink)}
.dv-head .pill{background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:1px 9px;font-weight:600}
.dv-head .pill.gold{background:var(--gold-soft);color:var(--gold)}
.bar{flex:1 1 100%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.big-count{flex:1 1 100%;text-align:center;font-size:calc(15px*var(--fz,1));color:var(--ink)}
.big-count b{font-size:26px;color:var(--accent)}

.deck{flex:1;position:relative;min-height:0;margin-bottom:var(--peek,12px)}
.card{position:absolute;inset:0;border-radius:var(--rad,18px);overflow:hidden;background:var(--stage);box-shadow:var(--shadow);
  display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  transition:transform .25s ease,opacity .25s,transform-origin .25s;cursor:grab;will-change:transform}
.card:active{cursor:grabbing}
.card.next{transform:translateY(12px) scale(.95);transform-origin:50% 100%;opacity:.85;pointer-events:none}
.card.next2{transform:translateY(24px) scale(.9);transform-origin:50% 100%;opacity:.6;pointer-events:none}
.card .info,.card .strip{transition:opacity .2s}
.card.next .info,.card.next .strip,.card.next2 .info,.card.next2 .strip{opacity:0}
.card.enter{animation:cardIn .26s ease-out}
@keyframes cardIn{from{opacity:0;transform:scale(.94)}}
.card .bg{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;filter:blur(26px) brightness(.55);opacity:.9}
.card .ph{position:relative;flex:1;min-height:0;z-index:1}
.card .main{width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none;pointer-events:none}
.card img{-webkit-user-drag:none}
.stamp{position:absolute;top:26px;padding:4px 14px;border:4px solid;border-radius:10px;font-size:28px;font-weight:800;
  letter-spacing:.08em;opacity:0;pointer-events:none;background:rgba(0,0,0,.25);z-index:3}
.s-r{left:20px;color:var(--stamp,#ff8fa3);border-color:var(--stamp,#ff8fa3);transform:rotate(-14deg) scale(var(--k,1))}
.s-l{right:20px;color:#e6e0da;border-color:#e6e0da;transform:rotate(14deg) scale(var(--k,1))}
.s-u{left:50%;top:auto;bottom:38%;color:#f3d08f;border-color:#f3d08f;transform:translateX(-50%) scale(var(--k,1))}
.s-d{left:50%;top:30px;color:#cfe3f7;border-color:#cfe3f7;transform:translateX(-50%) scale(var(--k,1));white-space:nowrap}
.info{position:relative;padding:6px 14px 10px;color:#fff;font-size:calc(12px*var(--fz,1));background:linear-gradient(transparent,rgba(0,0,0,.45));z-index:2}
.info .grp{display:inline-block;background:rgba(255,255,255,.2);border-radius:99px;padding:1px 9px;margin-bottom:3px;font-weight:600}
.info .nm{opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .who{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.info .who span{background:rgba(0,0,0,.45);border-radius:99px;padding:1px 9px}
.info .who .y{background:var(--accent)}
.strip{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:8px 10px 0}
.th{position:relative;flex:none;width:52px;height:69px;border:2px solid transparent;border-radius:8px;padding:0;overflow:hidden;background:#000;cursor:pointer;opacity:.7}
.th img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.th.sel{border-color:#fff;opacity:1;box-shadow:0 0 0 2px var(--accent)}
.th .mk{position:absolute;left:2px;bottom:2px;right:2px;display:flex;gap:2px;flex-wrap:wrap}
.th .mk i{font-style:normal;font-size:9px;background:var(--accent);color:#fff;border-radius:4px;padding:0 3px;line-height:14px}
.bothbtn{display:inline-block;margin-top:4px;background:#fff;color:#8a2f42;border:0;border-radius:99px;padding:3px 12px;font-weight:700;font-size:12px}

.acts{display:flex;justify-content:center;align-items:center;gap:14px;padding:12px 0 12px}
.ab{border:0;border-radius:50%;background:var(--card);box-shadow:0 3px 12px rgba(0,0,0,.14);display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;line-height:1;transition:transform .1s}
.ab:active{transform:scale(.9)}
.ab small{font-size:calc(10px*var(--fz,1));margin-top:3px;color:var(--muted);white-space:nowrap}
:root[data-btn="sm"] .ab small{font-size:calc(9px*var(--fz,1))}
.ab.big{width:66px;height:66px;font-size:28px}
.ab.mid{width:56px;height:56px;font-size:22px}
.ab.sm{width:42px;height:42px;font-size:17px;color:var(--muted)}
.ab.no{color:var(--muted)} .ab.yes{color:var(--accent)} .ab.up{color:var(--gold)}
.ab:disabled{opacity:.35}

/* ---------- 一般頁面 ---------- */
.pg{padding:8px 16px 32px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.panel h2{font-size:calc(16px*var(--fz,1));margin:0 0 8px}
.panel p{margin:6px 0;color:var(--muted);font-size:calc(14px*var(--fz,1))}
.hero{text-align:center;padding:28px 16px}
.hero .emo{font-size:52px;line-height:1.2}
.hero h2{font-size:calc(22px*var(--fz,1));margin:8px 0 6px}
.hero p{color:var(--muted);margin:4px 0;font-size:calc(16px*var(--fz,1))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);
  border-radius:12px;padding:10px 16px;cursor:pointer;font-size:calc(15px*var(--fz,1));text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.wide{width:100%;margin-top:8px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;font-size:calc(16px*var(--fz,1));cursor:pointer}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
input[type=text],input[type=password]{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.prog{margin:10px 0}
.prog .lbl{display:flex;justify-content:space-between;font-size:14px}
.prog .bar{height:8px;border-radius:4px;margin-top:4px}
.prog .bar i{background:var(--accent)}
.prog.done .bar i{background:var(--ok)}
.note{font-size:calc(13px*var(--fz,1));color:var(--muted)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}

/* 結果 */
.rtabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.rtabs::-webkit-scrollbar{display:none}
.rtabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:calc(14px*var(--fz,1));cursor:pointer;white-space:nowrap}
.rtabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rtabs button.over{color:#c0392b}
.rtabs button.on.over{background:#c0392b;border-color:#c0392b;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.gi{position:relative;border:0;padding:0;aspect-ratio:3/4;background:var(--line);border-radius:6px;overflow:hidden;cursor:pointer}
.gi img{width:100%;height:100%;object-fit:cover;display:block}
.gi .mk{position:absolute;left:3px;right:3px;bottom:3px;display:flex;gap:3px;flex-wrap:wrap}
.gi .mk i{font-style:normal;font-size:10px;line-height:16px;padding:0 5px;border-radius:5px;background:rgba(0,0,0,.6);color:#fff}
.gi .mk i.h{background:var(--accent)}
.gi.dim img{opacity:.45}
.empty{text-align:center;color:var(--muted);padding:40px 0}

/* 用途面板 */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35)}
.sh-in{width:100%;max-width:560px;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));
  animation:up .22s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sh-in h3{margin:0 0 4px;font-size:17px}
.sh-in .sub{color:var(--muted);font-size:12px;margin-bottom:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:8px 16px;font-size:calc(16px*var(--fz,1));cursor:pointer}
.chip.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold);font-weight:700}
.chip.add{border-style:dashed;color:var(--muted)}
.fixrow{display:flex;align-items:center;gap:10px;margin:16px 0 4px;font-size:16px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent);cursor:pointer}
.fixrow input{width:20px;height:20px;accent-color:var(--accent)}
.sh-btns{display:flex;gap:10px;margin-top:14px}
.sh-btns .btn{flex:1}

/* 看大圖 */
.viewer{position:fixed;inset:0;z-index:40;background:#000;color:#fff;display:flex;flex-direction:column}
.v-top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;font-size:13px}
.v-top span{flex:1;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-top button,.v-nav{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:99px;min-width:38px;height:38px;font-size:18px;cursor:pointer}
.v-scroll{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;min-height:0;scrollbar-width:none}
.v-scroll img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.v-scroll.zoom{display:block}
.v-scroll.zoom img{max-width:none;max-height:none;width:260%}
.v-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
.v-bar .chip{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff;font-size:15px;padding:6px 14px}
.v-bar .chip.on{background:var(--gold);border-color:var(--gold);color:#1d1916}
.v-bar .chip.fx.on{background:var(--accent);border-color:var(--accent);color:#fff}
.v-hint{text-align:center;font-size:11px;opacity:.5;padding-bottom:4px}

/* 分組管理 */
.admin{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;max-width:960px;margin:0 auto}
.adm-top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.adm-top b{font-size:16px}
.adm-body{flex:1;overflow:auto;padding:12px 14px 90px}
.adm-foot{position:absolute;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.sl{display:grid;grid-template-columns:auto 1fr 52px;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.sl input{width:100%;accent-color:var(--accent)}
.ag{display:inline-flex;flex-wrap:wrap;gap:4px;padding:5px;border-radius:10px;margin:0 2px 8px 0;border:1px dashed transparent;position:relative;vertical-align:top;max-width:100%}
.ag.multi{background:var(--accent-soft);border-color:var(--accent)}
.ag .n{position:absolute;right:6px;top:-9px;font-size:11px;background:var(--accent);color:#fff;border-radius:99px;padding:0 7px}
.at{position:relative;width:64px;border:2px solid transparent;border-radius:6px;padding:0;background:var(--line);cursor:pointer;overflow:hidden}
.at img{width:100%;height:80px;object-fit:cover;display:block}
.at small{position:absolute;left:0;right:0;bottom:0;font-size:10px;background:rgba(0,0,0,.55);color:#fff;text-align:center}
.at.ovr{border-color:var(--gold)}
.fdh{font-weight:700;margin:14px 0 6px;color:var(--gold)}

/* 對話框、提示 */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:24px}
.modal .box{background:var(--card);border-radius:18px;padding:22px 20px 16px;max-width:360px;width:100%;text-align:center;animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.modal .box h3{margin:0 0 8px;font-size:19px}
.modal .box p{margin:0 0 14px;color:var(--muted);white-space:pre-line}
.modal .box .btn{width:100%;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;background:rgba(30,26,23,.92);color:#fff;
  padding:8px 16px;border-radius:99px;font-size:14px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (min-width:700px){ .grid{grid-template-columns:repeat(4,1fr)} }

/* ---------- 外觀選項（⚙ → 外觀與手感） ---------- */
:root[data-fit="cover"] .card .main{object-fit:cover}
:root[data-btn="lg"] .ab.big{width:76px;height:76px;font-size:32px}
:root[data-btn="lg"] .ab.mid{width:64px;height:64px;font-size:25px}
:root[data-btn="sm"] .acts{padding:8px 0;gap:12px}
:root[data-btn="sm"] .ab.big{width:54px;height:54px;font-size:23px}
:root[data-btn="sm"] .ab.mid{width:46px;height:46px;font-size:18px}
:root[data-btn="sm"] .ab.sm{width:36px;height:36px;font-size:15px}
:root[data-btn="none"] .ab.big,:root[data-btn="none"] .ab.mid{display:none}
:root[data-btn="none"] .dv .acts{padding:6px 0;justify-content:space-between}
:root[data-btntext="off"] .ab small{display:none}
:root[data-thumb="sm"] .th{width:40px;height:53px}
:root[data-thumb="lg"] .th{width:64px;height:85px}
:root[data-thumbpos="side"] .card.multi{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr) auto}
:root[data-thumbpos="side"] .card.multi .ph{grid-column:1;grid-row:1}
:root[data-thumbpos="side"] .card.multi .strip{grid-column:2;grid-row:1;display:grid;align-content:center;gap:6px;padding:8px 8px 8px 0;overflow:hidden}
:root[data-thumbpos="side"] .card.multi .info{grid-column:1 / 3;grid-row:2}
.dv-head.mini{padding-bottom:4px}
.dv-head.mini .bar{height:3px}
.dv-head .big-count b{font-size:calc(34px*var(--fz,1))}
.fxp{position:fixed;left:0;top:0;z-index:65;pointer-events:none;line-height:1;color:var(--accent);
  animation:fxUp .95s ease-out both}
@keyframes fxUp{
  0%{opacity:0;transform:translate(var(--x0),var(--y0)) scale(.4)}
  15%{opacity:1}
  100%{opacity:0;transform:translate(calc(var(--x0) + var(--dx)),calc(var(--y0) - var(--dy))) scale(1.15) rotate(var(--r))}}
.opt{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:8px;align-items:center;margin:10px 0;font-size:calc(14px*var(--fz,1))}
.opt > span{color:var(--muted)}
.seg.sm{gap:4px}
.seg.sm button{padding:7px 2px;font-size:calc(13px*var(--fz,1));border-radius:10px}
.tones{display:flex;gap:10px;flex-wrap:wrap}
.tone{width:32px;height:32px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.tone.on{box-shadow:0 0 0 2px var(--ink)}
.opt input[type=text]{padding:7px 10px}
.stamps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tagx{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tagx .chip{font-size:calc(14px*var(--fz,1));padding:5px 8px 5px 12px;display:inline-flex;align-items:center;gap:4px}
.tagx .chip b{font-weight:400;color:var(--muted);padding:0 4px}
.tagx .chip.sug{border-style:dashed;color:var(--muted);padding:5px 12px}

<body>
<div id="app">
  <header class="hdr">
    <h1>婚紗照選擇器</h1><span class="me" id="meTag" hidden></span>
    <button class="sync" id="syncTag" hidden></button>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="swipe">📷<span>滑照片</span></button>
    <button data-tab="together">💞<span>一起決定</span><i class="badge" id="tgBadge"></i></button>
    <button data-tab="results">⭐<span>結果</span></button>
    <button data-tab="settings">⚙<span>設定</span></button>
  </nav>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sh-in">
    <h3>其他用途</h3>
    <div class="sub" id="shSub"></div>
    <div class="chips" id="shChips"></div>
    <label class="fixrow"><input type="checkbox" id="shFix"> 這張也要精修 ♥</label>
    <div class="sh-btns"><button class="btn" id="shCancel">取消</button><button class="btn pri" id="shOk">確定</button></div>
  </div>
</div>

<div class="viewer" id="viewer" hidden>
  <div class="v-top"><button class="v-nav" id="vPrev">‹</button><span id="vName"></span><button class="v-nav" id="vNext">›</button><button id="vClose">✕</button></div>
  <div class="v-scroll" id="vScroll"><img id="vImg" alt=""></div>
  <div class="v-hint">點兩下放大／縮小</div>
  <div class="v-bar" id="vBar"></div>
</div>

<div class="admin" id="admin" hidden>
  <div class="adm-top"><button class="btn" id="admBack">‹ 返回</button><b>照片分組</b></div>
  <div class="adm-body" id="admBody"></div>
  <div class="adm-foot" id="admFoot" hidden></div>
</div>

<div class="modal" id="modal" hidden><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
// ★ 部署好的 Apps Script 網頁應用程式網址（https://script.google.com/macros/s/.../exec），見 SETUP.md
var SYNC_URL = 'https://script.google.com/macros/s/AKfycbwfAzOQkvD0KGV1q4oaaD3NBcGoHgQMCSwzUzt4yPZ9dOrxq3SrIX6j7dMuOtZLTmsHCQ/exec';
var LIMIT = 60;                         // 精修張數上限
var TAG_PRESET = ['小卡', '相本', '禮物'];
// ★ 滑動手感（數字改這裡就好）
var UI = {
  swipeDist: 0.28,  // 左右拖超過卡片寬度的幾成就算數（0.28 = 28%）
  upDist: 0.2,      // 上滑拖超過卡片高度的幾成就算數
  flick: 0.45,      // 甩的速度（每毫秒幾 px）超過，不用拖很遠也算數
  tilt: 12,         // 拖到底時卡片最多歪幾度
  flyMs: 300,       // 卡片飛出去的時間（毫秒）
  backMs: 450,      // 沒滑成功彈回來的時間（毫秒）
  vibrate: true     // 拖過門檻時手機輕震一下（Android 才有，iPhone 網頁不支援）
};
var UI0 = Object.assign({}, UI);
var WHO = { h: '老公', w: '老婆' };
var DEMO = /[?&]demo\b/.test(location.search);
if (DEMO) LIMIT = 10;                   // 示範只有 40 張，上限改 10 張才看得到淘汰流程

/* ---------------- 儲存 ---------------- */
var NS = DEMO ? 'wpk-demo.' : 'wpk.';
function load(k, d) { try { var v = JSON.parse(localStorage.getItem(NS + k)); return v == null ? d : v; } catch (e) { return d; } }
function store(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch (e) {} }
var Y = Object.assign({ key: '', rev: 0, who: '' }, load('sync', {}));   // 同步設定
var KV = load('kv', {});        // 跟雲端同步的挑選紀錄
var PEND = load('pend', {});    // 還沒傳上去的變更
var MAN = load('man', null);    // 照片清單 {mrev, photos:[{id,name,t,g,fd}]}
var L = Object.assign({ tab: 'swipe', rtab: 'fix', elim: null }, load('local', {}));
/* 外觀與手感（每支手機各自記，在「⚙ → 外觀與手感」改） */
var LOOK_DEF = {
  tone: 'gold', mode: 'auto',              // 主題色、深淺色
  font: 'kai', fz: 'md',                   // 字型、字級
  fit: 'contain', radius: 'round', stack: 2, // 照片完整/填滿、卡片圓角、後面疊幾張
  thumb: 'md', thumbPos: 'bottom',         // 相似照片小圖大小、位置
  btn: 'md', btnText: true,                // 底部按鈕大小（none＝只用滑的）、按鈕文字
  head: 'full',                            // 上方資訊列 full/mini/big
  stampR: '精修 ♥', stampL: '不要', stampU: '其他用途', stampD: '等等再看',
  sens: 'mid', skipDown: true, fx: true    // 滑動靈敏度、下滑先跳過、愛心特效
};
var LOOK = Object.assign({}, LOOK_DEF, load('look', {}));
var TONES = {
  rose:  { n: '玫瑰',   l: ['#b5485d', '#f6e4e7'], d: ['#e07a8e', '#3b2529'], st: '#ff8fa3' },
  gold:  { n: '香檳金', l: ['#9a6e28', '#f4ead8'], d: ['#d9ad62', '#362b1a'], st: '#f3cf86' },
  sage:  { n: '鼠尾草', l: ['#567a5a', '#e4eee3'], d: ['#8fbf92', '#1f2d21'], st: '#a9e0ac' },
  blue:  { n: '霧藍',   l: ['#4b6b93', '#e3eaf4'], d: ['#8fb0d8', '#1e2836'], st: '#9fc8ff' },
  lilac: { n: '薰衣草', l: ['#77589f', '#ece5f5'], d: ['#b49be0', '#2a2236'], st: '#d2b8ff' },
  ink:   { n: '墨黑',   l: ['#2f2a26', '#ebe6e0'], d: ['#e8e0d6', '#33302c'], st: '#ffffff' }
};
var FONTS = {
  sys:   { n: '黑體' },
  serif: { n: '明體', fam: '"Noto Serif TC",serif', url: 'Noto+Serif+TC:wght@400;700' },
  kai:   { n: '楷體', fam: '"LXGW WenKai TC","Kaiti TC",serif', url: 'LXGW+WenKai+TC:wght@400;700' }
};
var darkMq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
function isDark() { return LOOK.mode === 'dark' || (LOOK.mode === 'auto' && !!darkMq && darkMq.matches); }
function applyLook() {
  var r = document.documentElement, t = TONES[LOOK.tone] || TONES.rose, c = isDark() ? t.d : t.l;
  if (LOOK.mode === 'auto') r.removeAttribute('data-theme'); else r.dataset.theme = LOOK.mode;
  r.style.setProperty('--accent', c[0]); r.style.setProperty('--accent-soft', c[1]); r.style.setProperty('--stamp', t.st);
  r.style.setProperty('--peek', (LOOK.stack || 0) * 12 + 'px');
  r.style.setProperty('--rad', { round: '18px', soft: '10px', square: '3px' }[LOOK.radius] || '18px');
  r.style.setProperty('--fz', { sm: 0.9, md: 1, lg: 1.15 }[LOOK.fz] || 1);
  r.dataset.fit = LOOK.fit; r.dataset.btn = LOOK.btn; r.dataset.btntext = LOOK.btnText ? 'on' : 'off';
  r.dataset.thumb = LOOK.thumb; r.dataset.thumbpos = LOOK.thumbPos;
  var F = FONTS[LOOK.font] || FONTS.sys;
  if (F.url && !document.getElementById('font-' + LOOK.font)) {
    var ln = document.createElement('link'); ln.rel = 'stylesheet'; ln.id = 'font-' + LOOK.font;
    ln.href = 'https://fonts.googleapis.com/css2?family=' + F.url + '&display=swap'; document.head.appendChild(ln);
  }
  if (F.fam) r.style.setProperty('--font', F.fam); else r.style.removeProperty('--font');
  var k = { easy: 0.7, mid: 1, firm: 1.3 }[LOOK.sens] || 1; // 靈敏度：門檻跟甩的速度一起縮放
  UI.swipeDist = UI0.swipeDist * k; UI.upDist = UI0.upDist * k; UI.flick = UI0.flick * k;
  var m = document.querySelector('meta[name=theme-color]'); if (m) m.content = isDark() ? '#1c1917' : '#faf7f2';
}
function setLook(k, v) {
  var d = LOOK_DEF[k];
  LOOK[k] = typeof d === 'number' ? +v : typeof d === 'boolean' ? (v === true || v === '1') : v;
  store('look', LOOK); applyLook(); render();
}
if (darkMq && darkMq.addEventListener) darkMq.addEventListener('change', applyLook);
applyLook();
function saveAll() { store('sync', Y); store('kv', KV); store('pend', PEND); store('local', L); }

(function () { // 連結帶進來的 ?key=…&me=h
  var q = new URLSearchParams(location.search);
  var k = q.get('key');
  if (k && k !== Y.key) { Y.key = k; Y.rev = 0; KV = {}; }
  var me = q.get('me');
  if (me === 'h' || me === 'w') Y.who = me;
  saveAll();
})();
// 網址一直帶著 key/me：iPhone「加到主畫面」的 App 跟 Safari 儲存空間分開，靠網址帶進去
function fixUrl() {
  if (DEMO) return;
  var q = new URLSearchParams();
  if (Y.key) q.set('key', Y.key);
  if (Y.who) q.set('me', Y.who);
  try { history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '')); } catch (e) {}
}

/* ---------------- 小工具 ---------------- */
function $(s, el) { return (el || document).querySelector(s); }
function $$(s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
function sameSet(a, b) { a = a || []; b = b || []; return a.length === b.length && a.every(function (x) { return b.indexOf(x) >= 0; }); }
function uniq(a) { return a.filter(function (x, i) { return a.indexOf(x) === i; }); }
var toastT;
function toast(msg) { var t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 1800); }
function modal(title, text, buttons) { // buttons: [{label, pri, fn}]
  var box = $('#modalBox');
  box.innerHTML = '<h3>' + esc(title) + '</h3><p>' + esc(text) + '</p>' +
    buttons.map(function (b, i) { return '<button class="btn' + (b.pri ? ' pri' : '') + '" data-i="' + i + '">' + esc(b.label) + '</button>'; }).join('');
  $('#modal').hidden = false;
  $$('button', box).forEach(function (el) {
    el.onclick = function () { $('#modal').hidden = true; var b = buttons[+el.dataset.i]; if (b.fn) b.fn(); };
  });
}

/* ---------------- 照片網址 ---------------- */
var demoCache = {};
function src(p, s) {
  if (p.demo) return demoImg(p);
  return 'https://lh3.googleusercontent.com/d/' + p.id + '=s' + s;
}
function imgTag(p, s, cls) {
  return '<img class="' + (cls || '') + '" data-id="' + esc(p.id) + '" data-s="' + s + '" src="' + esc(src(p, s)) + '" alt="" draggable="false" decoding="async"' + (cls === 'lz' ? ' loading="lazy"' : '') + '>';
}
// lh3 打不開時改用雲端硬碟縮圖網址再試一次
document.addEventListener('error', function (e) {
  var img = e.target;
  if (!img || img.tagName !== 'IMG' || !img.dataset.id || img.dataset.fb || DEMO) return;
  img.dataset.fb = '1';
  img.src = 'https://drive.google.com/thumbnail?id=' + img.dataset.id + '&sz=s' + (img.dataset.s || 1600);
}, true);
var preloaded = {};
function preload(p, s) { var u = src(p, s); if (preloaded[u]) return; preloaded[u] = 1; var i = new Image(); i.decoding = 'async'; i.src = u; }

/* ---------------- 示範模式（?demo）---------------- */
function demoImg(p) {
  if (demoCache[p.id]) return demoCache[p.id];
  var w = p.land ? 1500 : 1200, h = p.land ? 1000 : 1600, hue = (p.g * 47) % 360, m = Math.min(w, h);
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
    '<defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(' + hue + ',45%,74%)"/><stop offset="1" stop-color="hsl(' + ((hue + 40) % 360) + ',38%,36%)"/></linearGradient></defs>' +
    '<rect width="100%" height="100%" fill="url(#a)"/>' +
    '<circle cx="' + (w / 2) + '" cy="' + (h * (p.crop > .2 ? .42 : .3)) + '" r="' + (m * p.crop) + '" fill="rgba(255,255,255,.6)"/>' +
    '<rect x="' + (w / 2 - m * p.crop * .9) + '" y="' + (h * .5) + '" width="' + (m * p.crop * 1.8) + '" height="' + (h * .5) + '" rx="' + (m * .05) + '" fill="rgba(255,255,255,.4)"/>' +
    '<text x="50%" y="' + (h * .93) + '" font-size="' + (m * .065) + '" text-anchor="middle" fill="#fff" font-family="sans-serif">' + esc(p.label) + '</text></svg>';
  return (demoCache[p.id] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg));
}
function demoPhotos() {
  var out = [], kinds = ['全身', '半身', '橫拍', '特寫'], sizes = [1, 3, 1, 2, 1, 1, 4, 1, 2, 1, 3, 1];
  var t = Date.UTC(2026, 9, 10, 10, 0, 0), n = 1;
  for (var g = 1; g <= 24; g++) {
    var size = sizes[g % 12];
    t += 60000 * (2 + g % 3);
    for (var k = 0; k < size; k++) {
      var id = 'demo' + String(n).padStart(4, '0');
      out.push({ id: id, name: 'DSC_' + (1000 + n) + '.jpg', t: t + k * 4000, g: g, fd: g <= 12 ? '外拍' : '棚拍', demo: 1,
        land: size > 1 && k % 4 === 2, crop: [0.14, 0.24, 0.14, 0.32][k % 4],
        label: '#' + n + ' 第' + g + '組' + (size > 1 ? ' ' + kinds[k % 4] : '') });
      n++;
    }
  }
  return out;
}
if (DEMO && !MAN) MAN = { mrev: 1, photos: demoPhotos() };
if (DEMO && MAN) MAN.photos.forEach(function (p, i) { if (!p.demo) { var d = demoPhotos().find(function (x) { return x.id === p.id; }); if (d) Object.assign(p, d, { g: p.g }); } });
if (DEMO && !Y.key) Y.key = 'demo';

/* ---------------- 照片 → 卡片（相似照片同一張卡） ---------------- */
var PH = {}, CARDS = [], CARD_OF = {}, ORDER = {};
function buildCards() {
  PH = {}; CARDS = []; CARD_OF = {}; ORDER = {};
  var cur = null;
  ((MAN && MAN.photos) || []).forEach(function (p, i) {
    PH[p.id] = p; ORDER[p.id] = i;
    if (!cur || cur.g !== p.g) { cur = { id: p.id, g: p.g, photos: [] }; CARDS.push(cur); }
    cur.photos.push(p); CARD_OF[p.id] = cur;
  });
}
buildCards();

/* ---------------- 挑選紀錄 ----------------
   v.h.<卡片id> / v.w.<卡片id>：各自的選擇；f.<卡片id>：一起決定後的結果
   值 { f:[要精修的照片id], t:{ 照片id:['小卡',…] } }                        */
function me() { return Y.who; }
function other() { return Y.who === 'h' ? 'w' : 'h'; }
function vk(who, cid) { return 'v.' + who + '.' + cid; }
function clean(v, c) { // 只留下這張卡現在有的照片
  if (!v) return null;
  var ids = {}; c.photos.forEach(function (p) { ids[p.id] = 1; });
  var t = {}; Object.keys(v.t || {}).forEach(function (id) { if (ids[id]) t[id] = v.t[id]; });
  return { f: uniq((v.f || []).filter(function (id) { return ids[id]; })), t: t };
}
function vote(who, c) { return clean(KV[vk(who, c.id)], c); }
function setKV(k, v) {
  if (v == null) delete KV[k]; else KV[k] = v;
  PEND[k] = v == null ? null : v;
  saveAll(); schedulePush();
}
function mergeT() {
  var o = {};
  Array.prototype.forEach.call(arguments, function (t) {
    if (!t) return;
    Object.keys(t).forEach(function (id) { (t[id] || []).forEach(function (tag) { o[id] = o[id] || []; if (o[id].indexOf(tag) < 0) o[id].push(tag); }); });
  });
  return o;
}
function finalOf(c) {
  var ex = KV['f.' + c.id]; if (ex) return clean(ex, c);
  var a = vote('h', c), b = vote('w', c);
  if (!a || !b || !sameSet(a.f, b.f)) return null;
  return { f: (a.f || []).slice(), t: mergeT(a.t, b.t) };
}
function isConflict(c) {
  if (KV['f.' + c.id]) return false;
  var a = vote('h', c), b = vote('w', c);
  return !!(a && b && !sameSet(a.f, b.f));
}
function countDone(who) { var n = 0; CARDS.forEach(function (c) { if (vote(who, c)) n++; }); return n; }
function stats() {
  var N = CARDS.length, nh = countDone('h'), nw = countDone('w');
  var both = N > 0 && nh === N && nw === N;
  var conflicts = both ? CARDS.filter(isConflict) : [];
  var fix = 0;
  if (both) CARDS.forEach(function (c) { var f = finalOf(c); if (f) fix += (f.f || []).length; });
  return { N: N, nh: nh, nw: nw, both: both, conflicts: conflicts, fix: fix };
}
function myFixCount() { var n = 0, u = 0; CARDS.forEach(function (c) { var v = vote(me(), c); if (v) { n += (v.f || []).length; if (v.t && Object.keys(v.t).length) u++; } }); return { fix: n, up: u }; }
function tagCfg() { // cfg.tags：舊版是陣列（新增的用途），新版 {add:[新增], off:[拿掉的預設]}
  var c = KV['cfg.tags'];
  if (Array.isArray(c)) return { add: c.slice(), off: [] };
  return { add: ((c && c.add) || []).slice(), off: ((c && c.off) || []).slice() };
}
function usedTags() {
  var a = [];
  Object.keys(KV).forEach(function (k) { var v = KV[k]; if (/^[vf]\./.test(k) && v && v.t) Object.keys(v.t).forEach(function (id) { a = a.concat(v.t[id] || []); }); });
  return uniq(a);
}
function allTags() {
  var c = tagCfg();
  return uniq(TAG_PRESET.concat(c.add).filter(function (t) { return c.off.indexOf(t) < 0; }).concat(usedTags()));
}
function addTag(t) {
  var c = tagCfg(); c.add = uniq(c.add.concat([t])); c.off = c.off.filter(function (x) { return x !== t; });
  setKV('cfg.tags', c);
}
function removeTag(t) {
  if (usedTags().indexOf(t) >= 0) return toast('已經有照片標了「' + t + '」，先取消才能刪');
  var c = tagCfg(); c.add = c.add.filter(function (x) { return x !== t; });
  if (TAG_PRESET.indexOf(t) >= 0) c.off = uniq(c.off.concat([t]));
  setKV('cfg.tags', c);
}

/* ---------------- 同步 ---------------- */
var badKey = false, pushT = null, pushing = false, pulling = false, manLoading = false, syncState = 'ok';
function syncOn() { return !DEMO && !!SYNC_URL && !!Y.key && !badKey; }
function setSync(s) {
  syncState = s;
  var el = $('#syncTag');
  el.hidden = DEMO || !SYNC_URL || !Y.key;
  el.className = 'sync ' + s;
  el.textContent = { ok: '已同步', busy: '同步中…', off: '離線，稍後補傳', err: '同步失敗', bad: '密碼錯誤' }[s] || '';
  if (s === 'ok' && Object.keys(PEND).length) el.textContent = '待上傳 ' + Object.keys(PEND).length;
}
function schedulePush(ms) { if (!syncOn()) return; clearTimeout(pushT); pushT = setTimeout(push, ms || 1200); }
function push(leaving) {
  if (!syncOn() || pushing) return;
  var keys = Object.keys(PEND).slice(0, 200); if (!keys.length) return;
  pushing = true; setSync('busy');
  var sent = {}; keys.forEach(function (k) { sent[k] = PEND[k]; });
  var body = JSON.stringify({ key: Y.key, changes: sent });
  var retry = 1200;
  fetch(SYNC_URL, { method: 'POST', keepalive: !!leaving && body.length < 60000, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.ok) { if (d.error === 'bad key') { badKey = true; setSync('bad'); render(); } else { setSync('err'); retry = 10000; } return; }
      keys.forEach(function (k) { if (same(PEND[k], sent[k])) delete PEND[k]; }); // 一批最多 200 筆，伺服器全收
      saveAll(); setSync('ok');
    })
    .catch(function () { setSync('off'); retry = 10000; })
    .then(function () { pushing = false; if (Object.keys(PEND).length) schedulePush(retry); });
}
function pull() {
  if (!syncOn() || pulling) return;
  pulling = true;
  var since = Y.rev || 0;
  fetch(SYNC_URL + '?key=' + encodeURIComponent(Y.key) + '&since=' + since)
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.ok) { if (d.error === 'bad key') { badKey = true; setSync('bad'); render(); } return; }
      var changed = false;
      if (since === 0 || d.reset) { KV = {}; changed = true; Object.keys(PEND).forEach(function (k) { if (PEND[k] != null) KV[k] = PEND[k]; }); }
      d.changes.forEach(function (c) {

  $('#admin').hidden = true; L.tab = 'swipe'; saveAll(); render();
  toast('已發布 ' + Object.keys(PH).length + ' 張照片');
}

/* ---------------- 開始 ---------------- */
fixUrl();
render();
if (syncOn()) { pull(); if (!MAN) loadManifest(); if (Object.keys(PEND).length) schedulePush(); }
</script>
